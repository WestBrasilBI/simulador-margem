<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0c4976">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Simulador de Margem - Especialidades</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --blue: #0c4976;
    --blue-light: #1a6aa8;
    --red: #e02e39;
    --white: #ffffff;
    --gray-bg: #f4f6f9;
    --gray-border: #dde3ea;
    --gray-text: #6b7a8d;
    --green: #1d8a4e;
    --text: #1a2533;
    --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--gray-bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  header {
    background: var(--blue);
    color: var(--white);
    padding: 12px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .header-row { display: flex; align-items: center; gap: 10px; }
  .logo-text { font-weight: 800; font-size: 18px; color: white; letter-spacing: -0.5px; }
  .subtitle { font-size: 11px; opacity: 0.75; flex: 1; margin-left: 10px; }
  .btn-reset {
    margin-left: auto;
    background: rgba(255,255,255,0.15);
    border: none; color: white; padding: 6px 12px;
    border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; flex-shrink: 0;
  }
  .steps-bar { background: var(--blue); padding: 0 16px 12px; display: flex; gap: 6px; }
  .step-dot { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25); transition: background 0.3s; }
  .step-dot.active { background: var(--white); }
  .step-dot.done { background: rgba(255,255,255,0.55); }

  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }

  .card { background: var(--white); border-radius: 14px; padding: 20px; box-shadow: var(--card-shadow); margin-bottom: 12px; }
  .card-title { font-size: 13px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-text); margin-bottom: 5px; }
  input[type=text], input[type=number] {
    width: 100%; border: 1.5px solid var(--gray-border); border-radius: 8px;
    padding: 11px 12px; font-size: 15px; color: var(--text); background: var(--white);
    outline: none; transition: border-color 0.2s; -webkit-appearance: none;
  }
  input:focus { border-color: var(--blue); }

  .search-wrap { position: relative; }
  .autocomplete-list {
    position: absolute; top: 100%; left: 0; right: 0; background: white;
    border: 1.5px solid var(--blue); border-top: none; border-radius: 0 0 10px 10px;
    max-height: 220px; overflow-y: auto; z-index: 50; box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  }
  .autocomplete-item { padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--gray-border); font-size: 13px; }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover, .autocomplete-item:active { background: var(--gray-bg); }
  .autocomplete-item strong { display: block; color: var(--blue); font-weight: 700; }
  .autocomplete-item span { color: var(--gray-text); font-size: 12px; }

  .client-info {
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%);
    color: white; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
  }
  .client-info h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .client-info-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; }
  .client-badge { background: rgba(255,255,255,0.15); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; }

  .produto-card { background: var(--white); border-radius: 10px; box-shadow: var(--card-shadow); margin-bottom: 8px; overflow: hidden; border: 1.5px solid var(--gray-border); }
  .produto-header { background: var(--blue); color: white; padding: 7px 12px; display: flex; align-items: center; gap: 7px; }
  .produto-num { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 1px 7px; font-size: 10px; font-weight: 700; }
  .produto-nome-header { font-size: 12px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-remove { background: rgba(255,255,255,0.15); border: none; color: white; border-radius: 5px; padding: 2px 7px; cursor: pointer; font-size: 15px; line-height: 1; }
  .produto-body { padding: 10px 12px; }
  .input-group { margin-bottom: 8px; }
  .input-group label { font-size: 10px; font-weight: 600; color: var(--gray-text); margin-bottom: 3px; }
  .input-group input { width: 100%; border: 1.5px solid var(--gray-border); border-radius: 6px; padding: 6px 9px; font-size: 13px; background: var(--white); outline: none; transition: border-color 0.2s; }
  .input-group input:focus { border-color: var(--blue); }
  .inputs-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .calc-section { background: var(--gray-bg); border-radius: 7px; padding: 8px 10px; }
  .calc-row { display: flex; justify-content: space-between; gap: 8px; }
  .calc-item-inline { display: flex; align-items: baseline; gap: 5px; }
  .calc-label { font-size: 10px; font-weight: 600; color: var(--gray-text); text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; }
  .calc-value { font-size: 13px; font-weight: 700; color: var(--text); }
  .calc-value.green { color: var(--green); }
  .calc-value.red { color: var(--red); }
  .calc-value.highlight { color: var(--blue); }
  .separator { border: none; border-top: 1px solid var(--gray-border); margin: 6px 0; }

  .totals-card { background: var(--blue); color: white; border-radius: 14px; padding: 18px; margin-top: 4px; }
  .totals-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; opacity: 0.8; }
  .totals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .total-label { font-size: 10px; font-weight: 600; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.3px; }
  .total-value { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .total-value.accent { color: #ffd166; }

  .btn-primary { width: 100%; background: var(--blue); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
  .btn-primary:hover { background: var(--blue-light); }
  .btn-secondary { width: 100%; background: transparent; color: var(--blue); border: 1.5px solid var(--blue); border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn-add { width: 100%; background: white; color: var(--blue); border: 2px dashed var(--blue); border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-add-icon { font-size: 22px; font-weight: 400; }
  .btn-export { width: 100%; background: var(--red); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .alert.error { background: #fdecea; border: 1px solid var(--red); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #9b1a20; margin-top: 10px; }
  .version-tag { text-align: center; font-size: 11px; color: var(--gray-text); padding: 12px; }

  .hist-cli { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 8px; display: flex; align-items: center; gap: 5px; }
  .hist-prod { background: #eef4fb; border-left: 3px solid var(--blue); border-radius: 0 6px 6px 0; padding: 7px 10px; margin-bottom: 10px; font-size: 12px; color: var(--gray-text); display: none; }
  .hist-prod strong { color: var(--blue); font-weight: 700; }

  /* EXPORT OVERLAY */
  #exportOverlay { display: none; position: fixed; inset: 0; background: white; z-index: 300; flex-direction: column; }
  #exportOverlay.visible { display: flex; }
  #exportDocWrap { flex: 1; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; padding: 8px 8px 0; }
  #exportDoc { width: 100%; max-width: 480px; background: white; transform-origin: top center; }
  .exp-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 2px solid var(--blue); margin-bottom: 10px; }
  .exp-logo { font-weight: 800; font-size: 15px; color: var(--blue); }
  .exp-header-right { text-align: right; }
  .exp-title { font-size: 10px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.5px; }
  .exp-date { font-size: 10px; color: var(--gray-text); margin-top: 1px; }
  .exp-client { background: var(--gray-bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .exp-client-nome { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .exp-client-info { font-size: 10px; color: var(--gray-text); }
  .exp-product { border: 1px solid var(--gray-border); border-radius: 8px; margin-bottom: 6px; overflow: hidden; }
  .exp-product-hdr { background: var(--blue); color: white; padding: 5px 10px; font-size: 10px; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .exp-product-body { padding: 6px 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .exp-field-label { font-size: 8px; color: var(--gray-text); text-transform: uppercase; font-weight: 600; }
  .exp-field-value { font-size: 11px; font-weight: 600; color: var(--text); }
  .exp-field-value.green { color: var(--green); }
  .exp-field-value.red { color: var(--red); }
  .exp-totals { background: var(--blue); color: white; border-radius: 8px; padding: 10px; margin-top: 4px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .exp-totals-title { font-size: 9px; font-weight: 700; text-transform: uppercase; opacity: 0.75; margin-bottom: 8px; letter-spacing: 0.5px; }
  .exp-totals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .exp-total-label { font-size: 8px; opacity: 0.7; text-transform: uppercase; font-weight: 600; }
  .exp-total-value { font-size: 13px; font-weight: 700; margin-top: 1px; }
  .exp-total-value.accent { color: #ffd166; }
  .exp-full { grid-column: 1/-1; }
  .exp-footer { font-size: 8px; color: var(--gray-text); text-align: center; margin-top: 8px; }
  .export-bar { background: white; border-top: 1px solid var(--gray-border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .export-bar-hint { font-size: 12px; color: var(--gray-text); }
  .export-bar-hint strong { color: var(--text); }
  .btn-fechar { background: var(--gray-bg); border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; }

  #updateToast {
    display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--blue); color: white; border-radius: 24px; padding: 12px 22px;
    font-size: 14px; font-weight: 600; align-items: center; gap: 10px;
    z-index: 999; box-shadow: 0 4px 16px rgba(0,0,0,0.25); white-space: nowrap;
  }
  .toast-spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <span class="logo-text">West Brasil</span>
    <div class="subtitle">Simulador de Margem - Especialidades</div>
    <button class="btn-reset" onclick="resetAll()">↺ Novo</button>
  </div>
  <div class="steps-bar">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
  </div>
</header>

<!-- TELA 1: CLIENTE -->
<div class="screen active" id="screen1">
  <div class="card">
    <div class="card-title">1. Identificação do Cliente</div>
    <div class="search-wrap">
      <label for="inputCliente">Código ou nome do cliente</label>
      <input type="text" id="inputCliente" placeholder="Ex: 3657 ou Marcelo Moto..."
             autocomplete="off" inputmode="text"
             oninput="buscaCliente(this.value)" onkeydown="navegarListaCli(event)">
      <div class="autocomplete-list" id="autoListCli" style="display:none"></div>
    </div>
    <div id="clienteInfo" style="display:none; margin-top:14px;">
      <div class="client-info">
        <h3 id="clienteNome"></h3>
        <div id="clienteDetalhes" class="client-info-row"></div>
        <div class="hist-cli" id="clienteHistData" style="display:none">
          <span>🕐</span><span id="clienteHistTexto"></span>
        </div>
      </div>
    </div>
    <div id="clienteErro" class="alert error" style="display:none">
      Cliente não encontrado. Verifique o código.
    </div>
    <button class="btn-primary" id="btnProceed1" onclick="irParaTela2()" style="display:none">
      Simular Produtos →
    </button>
  </div>
  <div class="version-tag" id="versionTag">Carregando dados...</div>
</div>

<!-- TELA 2: PRODUTOS -->
<div class="screen" id="screen2">
  <div class="client-info" id="resumoClienteTopo" style="margin-bottom:12px;">
    <h3 id="resumoNome"></h3>
    <div id="resumoDetalhes" class="client-info-row"></div>
  </div>

  <div id="produtosList"></div>

  <button class="btn-add" onclick="adicionarProduto()">
    <span class="btn-add-icon">+</span> Adicionar Produto
  </button>

  <div class="totals-card" id="totalsCard" style="display:none; margin-top:16px;">
    <div class="totals-title">Resumo da Simulação</div>
    <div class="totals-grid">
      <div>
        <div class="total-label">Qtde Total (Emb.)</div>
        <div class="total-value" id="totQtde">—</div>
      </div>
      <div>
        <div class="total-label">Faturamento Total</div>
        <div class="total-value" id="totFaturamento">—</div>
      </div>
      <div style="grid-column:1/-1">
        <div class="total-label">Margem Bruta %</div>
        <div class="total-value accent" id="totMargem">—</div>
      </div>
    </div>
  </div>

  <button class="btn-export" onclick="gerarExport()">↗ Compartilhar Simulação</button>
  <button class="btn-secondary" style="margin-top:8px;" onclick="irParaTela1()">← Voltar</button>
</div>

<!-- EXPORT OVERLAY -->
<div id="exportOverlay">
  <div id="exportDocWrap"><div id="exportDoc"></div></div>
  <div class="export-bar">
    <div class="export-bar-hint">📸 Tire um <strong>print</strong> da tela</div>
    <button class="btn-fechar" onclick="fecharExport()">✕ Fechar</button>
  </div>
</div>

<div id="updateToast">
  <div class="toast-spinner"></div>
  Atualizando app...
</div>

<script src="data/data.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update();
    });
  }).catch(() => {});
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      const t = document.getElementById('updateToast');
      if (t) t.style.display = 'flex';
      setTimeout(() => window.location.reload(), 1500);
    }
  });
}
</script>
<script>
let clienteAtual = null;
let produtos     = [];
let produtoIdSeq = 0;

const fmt = {
  moeda: v => v == null || isNaN(v) ? '—' : 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}),
  pct:   v => v == null || isNaN(v) ? '—' : (v * 100).toFixed(1) + '%',
};

window.addEventListener('load', () => {
  try {
    const tag = document.getElementById('versionTag');
    tag.textContent = typeof DATA_VERSION !== 'undefined' ? 'Dados de: ' + DATA_VERSION : 'Dados carregados';
  } catch(e) {}
});

// ─── NAVEGAÇÃO ───────────────────────────────────────────────────────────────
function setScreen(n) {
  document.querySelectorAll('.screen').forEach((s,i) => s.classList.toggle('active', i+1 === n));
  ['dot1','dot2'].forEach((id,i) => {
    document.getElementById(id).className = 'step-dot' + (i+1 < n ? ' done' : i+1 === n ? ' active' : '');
  });
  window.scrollTo(0,0);
}

function irParaTela1() {
  setScreen(1);
}

function irParaTela2() {
  if (!clienteAtual) return;
  setScreen(2);
  document.getElementById('resumoNome').textContent = clienteAtual.cod + ' — ' + clienteAtual.nome;
  document.getElementById('resumoDetalhes').innerHTML =
    `<span class="client-badge">${clienteAtual.ramo}</span>
     <span class="client-badge">${clienteAtual.segmento}</span>`;
  if (produtos.length === 0) adicionarProduto();
  else { produtos.forEach(p => atualizarDisplayCard(p.id)); atualizarTotais(); }
}

function resetAll() {
  clienteAtual = null; produtos = []; produtoIdSeq = 0;
  document.getElementById('inputCliente').value = '';
  document.getElementById('clienteInfo').style.display = 'none';
  document.getElementById('clienteErro').style.display = 'none';
  document.getElementById('btnProceed1').style.display = 'none';
  document.getElementById('autoListCli').style.display = 'none';
  document.getElementById('produtosList').innerHTML = '';
  document.getElementById('totalsCard').style.display = 'none';
  setScreen(1);
}

// ─── TELA 1: CLIENTE ─────────────────────────────────────────────────────────
let searchTimerCli = null;
function buscaCliente(val) {
  clearTimeout(searchTimerCli);
  document.getElementById('clienteErro').style.display = 'none';
  document.getElementById('clienteInfo').style.display = 'none';
  document.getElementById('btnProceed1').style.display = 'none';
  clienteAtual = null;
  const v = val.trim();
  if (!v) { document.getElementById('autoListCli').style.display = 'none'; return; }
  if (/^\d+$/.test(v) && CLIENTES[v]) {
    selecionarCliente(v, CLIENTES[v]);
    document.getElementById('autoListCli').style.display = 'none';
    return;
  }
  searchTimerCli = setTimeout(() => {
    if (v.length < 3) { document.getElementById('autoListCli').style.display = 'none'; return; }
    const vLow = v.toLowerCase();
    const matches = [];
    for (const [cod, c] of Object.entries(CLIENTES)) {
      if (c.nome.toLowerCase().includes(vLow) || cod.includes(v)) {
        matches.push({ cod, ...c });
        if (matches.length >= 20) break;
      }
    }
    const list = document.getElementById('autoListCli');
    if (!matches.length) { list.style.display = 'none'; return; }
    list.innerHTML = matches.map(m =>
      `<div class="autocomplete-item" onclick="selecionarClienteItem('${m.cod}')">
        <strong>${m.cod} — ${m.nome}</strong>
        <span>${m.ramo} | ${m.segmento}</span>
      </div>`
    ).join('');
    list.style.display = 'block';
  }, 300);
}

function selecionarClienteItem(cod) {
  document.getElementById('inputCliente').value = cod + ' — ' + CLIENTES[cod].nome;
  document.getElementById('autoListCli').style.display = 'none';
  selecionarCliente(cod, CLIENTES[cod]);
}

function selecionarCliente(cod, c) {
  clienteAtual = { cod, ...c };
  document.getElementById('clienteNome').textContent = c.nome;
  document.getElementById('clienteDetalhes').innerHTML =
    `<span class="client-badge">${c.ramo}</span>
     <span class="client-badge">${c.segmento}</span>`;
  const hist = (typeof HIST_CLIENTE !== 'undefined') ? HIST_CLIENTE[cod] : null;
  const histEl = document.getElementById('clienteHistData');
  if (histEl) {
    if (hist) { document.getElementById('clienteHistTexto').textContent = 'Última compra: ' + hist.data; histEl.style.display = 'flex'; }
    else { histEl.style.display = 'none'; }
  }
  document.getElementById('clienteInfo').style.display = 'block';
  document.getElementById('btnProceed1').style.display = 'block';
}

function navegarListaCli(e) {
  if (e.key === 'Escape') document.getElementById('autoListCli').style.display = 'none';
}
document.addEventListener('mousedown', e => {
  // Clique em item de produto (autocomplete)
  const item = e.target.closest('.autocomplete-item');
  if (item && item.closest('.prod-autocomplete')) {
    e.preventDefault();
    const autoEl = item.closest('.prod-autocomplete');
    const pid = autoEl._pid;
    selecionarProdutoItem(pid, item.dataset.cod, item.dataset.nome);
    return;
  }
  // Fechar dropdowns ao clicar fora
  if (!e.target.closest('.search-wrap')) {
    document.getElementById('autoListCli').style.display = 'none';
    document.querySelectorAll('.prod-autocomplete').forEach(el => el.style.display = 'none');
  }
});

// ─── TELA 2: PRODUTOS ────────────────────────────────────────────────────────
function adicionarProduto() {
  const id = ++produtoIdSeq;
  produtos.push({ id, cod:'', nome:'', qtde:'', preco:'' });
  renderizarProdutos();
  atualizarTotais();
  setTimeout(() => { const el = document.getElementById('pBusca_' + id); if (el) el.focus(); }, 100);
}

function removerProduto(id) {
  produtos = produtos.filter(p => p.id !== id);
  renderizarProdutos();
  atualizarTotais();
}

function renderizarProdutos() {
  document.getElementById('produtosList').innerHTML = produtos.map((p, idx) => criarCardProduto(p, idx+1)).join('');
}

function criarCardProduto(p, num) {
  const calc = calcularLinha(p);
  const nomeExibir = p.nome || (p.cod ? 'Produto não encontrado' : 'Informe o produto');
  const mgClass = calc.AB != null ? (calc.AB >= 0.1 ? 'green' : calc.AB >= 0 ? 'highlight' : 'red') : '';
  return `<div class="produto-card" id="card_${p.id}">
    <div class="produto-header">
      <span class="produto-num">#${num}</span>
      <span class="produto-nome-header" id="pNome_${p.id}">${nomeExibir}</span>
      <button class="btn-remove" onclick="removerProduto(${p.id})">×</button>
    </div>
    <div class="produto-body">
      <div class="input-group search-wrap">
        <label>PRODUTO (código ou nome)</label>
        <input type="text" id="pBusca_${p.id}" value="${p.cod ? p.cod + (p.nome ? ' — ' + p.nome : '') : ''}"
               placeholder="Ex: 124699 ou ADITECH..."
               autocomplete="off"
               oninput="buscaProduto(${p.id}, this.value)"
               onkeydown="if(event.key==='Escape') document.getElementById('pAuto_${p.id}').style.display='none'">
        <div class="autocomplete-list prod-autocomplete" id="pAuto_${p.id}" style="display:none"></div>
      </div>
      <div class="inputs-row2">
        <div class="input-group" style="margin-bottom:0">
          <label>QTDE (Emb.)</label>
          <input type="number" id="pQtde_${p.id}" value="${p.qtde}" placeholder="0"
                 min="0" step="1" inputmode="decimal" oninput="atualizarCampo(${p.id},'qtde',this.value)">
        </div>
        <div class="input-group" style="margin-bottom:0">
          <label>PREÇO VENDA (R$/emb.)</label>
          <input type="number" id="pPreco_${p.id}" value="${p.preco}" placeholder="0.00"
                 min="0" step="0.01" inputmode="decimal" oninput="atualizarCampo(${p.id},'preco',this.value)">
        </div>
      </div>
      <div class="hist-prod" id="pHist_${p.id}"></div>
      <div class="calc-section">
        <div class="calc-row">
          <div class="calc-item-inline"><span class="calc-label">Custo:</span><span class="calc-value" id="pCusto_${p.id}">${calc.J != null ? fmt.moeda(calc.J) : '—'}</span></div>
          <div class="calc-item-inline"><span class="calc-label">Sugerido:</span><span class="calc-value" id="pPrecoSug_${p.id}">${calc.precoSug != null ? fmt.moeda(calc.precoSug) : '—'}</span></div>
        </div>
        <div class="calc-row" style="margin-top:5px">
          <div class="calc-item-inline"><span class="calc-label">Faturamento:</span><span class="calc-value" id="pFatur_${p.id}">${calc.U != null ? fmt.moeda(calc.U) : '—'}</span></div>
          <div class="calc-item-inline"><span class="calc-label">Margem:</span><span class="calc-value ${mgClass}" id="pMargem_${p.id}" style="font-size:15px">${calc.AB != null ? fmt.pct(calc.AB) : '—'}</span></div>
        </div>
      </div>
    </div>
  </div>`;
}

// Autocomplete de produto
let searchTimerProd = {};
function buscaProduto(id, val) {
  clearTimeout(searchTimerProd[id]);
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const autoEl = document.getElementById('pAuto_' + id);
  const v = val.trim();
  if (!v) { autoEl.style.display = 'none'; p.cod = ''; p.nome = ''; atualizarDisplayCard(id); atualizarTotais(); return; }

  // Nenhum auto-select imediato — sempre mostra a lista para o usuário clicar

  searchTimerProd[id] = setTimeout(() => {
    if (v.length < 2) { autoEl.style.display = 'none'; return; }
    const vLow = v.toLowerCase();
    const matches = [];
    for (const [cod, nome] of Object.entries(NOMES_PRODUTO)) {
      if (nome.toLowerCase().includes(vLow) || cod.includes(v)) {
        matches.push({ cod, nome });
        if (matches.length >= 15) break;
      }
    }
    if (!matches.length) { autoEl.style.display = 'none'; return; }
    autoEl.innerHTML = matches.map(m =>
      `<div class="autocomplete-item" data-cod="${m.cod.replace(/"/g,'&quot;')}" data-nome="${m.nome.replace(/"/g,'&quot;')}">
        <strong>${m.cod}</strong>
        <span>${m.nome}</span>
      </div>`
    ).join('');
    autoEl.style.display = 'block';
    autoEl._pid = id;
  }, 250);
}

function selecionarProdutoItem(id, cod, nome) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  p.cod = cod;
  p.nome = nome;
  const buscaEl = document.getElementById('pBusca_' + id);
  if (buscaEl) buscaEl.value = cod + ' — ' + nome;
  const autoEl = document.getElementById('pAuto_' + id);
  if (autoEl) autoEl.style.display = 'none';
  atualizarDisplayCard(id);
  atualizarTotais();
}

function atualizarCampo(id, campo, valor) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  p[campo] = valor;
  requestAnimationFrame(() => { atualizarDisplayCard(id); atualizarTotais(); });
}

function atualizarDisplayCard(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const calc = calcularLinha(p);
  const nomeEl = document.getElementById('pNome_' + id);
  if (nomeEl) nomeEl.textContent = p.nome || (p.cod ? 'Produto não encontrado' : 'Informe o produto');
  const set = (elId, val) => { const el = document.getElementById(elId); if (el) el.textContent = val; };
  set('pCusto_'    + id, calc.J       != null ? fmt.moeda(calc.J)       : '—');
  set('pPrecoSug_' + id, calc.precoSug != null ? fmt.moeda(calc.precoSug) : '—');
  set('pFatur_'    + id, calc.U       != null ? fmt.moeda(calc.U)       : '—');
  // Histórico
  const histEl = document.getElementById('pHist_' + id);
  if (histEl && clienteAtual && p.cod) {
    const hist = (typeof HIST_PRODUTO !== 'undefined') ? HIST_PRODUTO[clienteAtual.cod + '|' + p.cod] : null;
    if (hist) {
      histEl.innerHTML = `🕐 Último pedido: <strong>${hist.data}</strong> &nbsp;·&nbsp; Preço pago: <strong>${fmt.moeda(hist.preco)}/emb.</strong>`;
      histEl.style.display = 'block';
    } else { histEl.style.display = 'none'; }
  }
  const mgEl = document.getElementById('pMargem_' + id);
  if (mgEl) {
    mgEl.textContent = calc.AB != null ? fmt.pct(calc.AB) : '—';
    mgEl.className = 'calc-value ' + (calc.AB == null ? '' : calc.AB >= 0.1 ? 'green' : calc.AB >= 0 ? 'highlight' : 'red');
    mgEl.style.fontSize = '16px';
  }
}

// ─── CÁLCULO ─────────────────────────────────────────────────────────────────
function calcularLinha(p) {
  const prodCod = String(p.cod || '').trim();
  const qtde    = parseFloat(p.qtde)  || 0;
  const preco   = parseFloat(p.preco) || 0;
  if (!prodCod || !clienteAtual) return {};

  const ramo_cod   = clienteAtual.ramo_cod || "";
  const key        = prodCod + "|" + ramo_cod;
  const keyGeral   = prodCod + "|geral";
  const entry      = CUSTO[key] || CUSTO[keyGeral];

  if (!entry) return { nome: p.nome || null };

  const J        = entry.custo;
  const precoSug = entry.preco_lista;
  const nome     = entry.nome || p.nome;

  const U  = preco * qtde;           // faturamento
  const O  = J * qtde;               // custo total
  const AB = U ? (U - O) / U : null; // margem bruta

  return { nome, J, precoSug, U, AB, _U: U, _O: O, _qtde: qtde };
}

function atualizarTotais() {
  const card = document.getElementById('totalsCard');
  if (produtos.length === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  let totalQtde = 0, totalU = 0, totalO = 0, validas = 0;
  for (const p of produtos) {
    const c = calcularLinha(p);
    if (c._U) { totalQtde += c._qtde || 0; totalU += c._U; totalO += c._O; validas++; }
  }
  if (!validas) {
    ['totQtde','totFaturamento','totMargem'].forEach(id => document.getElementById(id).textContent = '—');
    return;
  }
  const mb = totalU ? (totalU - totalO) / totalU : null;
  document.getElementById('totQtde').textContent        = totalQtde.toLocaleString('pt-BR') + ' emb.';
  document.getElementById('totFaturamento').textContent = fmt.moeda(totalU);
  document.getElementById('totMargem').textContent      = fmt.pct(mb);
}

// ─── EXPORT ──────────────────────────────────────────────────────────────────
function gerarExport() {
  if (!clienteAtual || produtos.length === 0) return;
  const now = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

  let produtosHtml = '';
  produtos.forEach((p, idx) => {
    if (!p.cod) return;
    const calc = calcularLinha(p);
    const nome = calc.nome || p.nome || ('Produto ' + p.cod);
    const mgClass = calc.AB == null ? '' : calc.AB >= 0.1 ? 'green' : calc.AB >= 0 ? '' : 'red';
    const hist = (typeof HIST_PRODUTO !== 'undefined' && clienteAtual) ? HIST_PRODUTO[clienteAtual.cod + '|' + p.cod] : null;
    produtosHtml += `
      <div class="exp-product">
        <div class="exp-product-hdr">#${idx+1} &nbsp;${p.cod} — ${nome}</div>
        <div class="exp-product-body">
          <div><div class="exp-field-label">Qtde (Emb.)</div><div class="exp-field-value">${p.qtde||'—'}</div></div>
          <div><div class="exp-field-label">Preço Sugerido</div><div class="exp-field-value">${calc.precoSug != null ? fmt.moeda(calc.precoSug) : '—'}</div></div>
          <div><div class="exp-field-label">Custo / Emb.</div><div class="exp-field-value">${calc.J != null ? fmt.moeda(calc.J) : '—'}</div></div>
          <div><div class="exp-field-label">Preço Venda</div><div class="exp-field-value">${fmt.moeda(parseFloat(p.preco)||0)}</div></div>
          <div><div class="exp-field-label">Faturamento</div><div class="exp-field-value">${calc.U != null ? fmt.moeda(calc.U) : '—'}</div></div>
          <div><div class="exp-field-label">Margem Bruta %</div><div class="exp-field-value ${mgClass}" style="font-size:13px">${calc.AB != null ? fmt.pct(calc.AB) : '—'}</div></div>
          ${hist ? `<div style="grid-column:1/-1"><div class="exp-field-label">Último Pedido</div><div class="exp-field-value">${hist.data} &nbsp;·&nbsp; ${fmt.moeda(hist.preco)}/emb.</div></div>` : ''}
        </div>
      </div>`;
  });

  let totalQtde = 0, totalU = 0, totalO = 0, validas = 0;
  for (const p of produtos) {
    const c = calcularLinha(p);
    if (c._U) { totalQtde += c._qtde || 0; totalU += c._U; totalO += c._O; validas++; }
  }
  const totaisHtml = validas ? `
    <div class="exp-totals">
      <div class="exp-totals-title">Resumo Total</div>
      <div class="exp-totals-grid">
        <div><div class="exp-total-label">Qtde Total</div><div class="exp-total-value">${totalQtde} emb.</div></div>
        <div><div class="exp-total-label">Faturamento</div><div class="exp-total-value">${fmt.moeda(totalU)}</div></div>
        <div class="exp-full"><div class="exp-total-label">Margem Bruta %</div><div class="exp-total-value accent">${fmt.pct(totalU ? (totalU-totalO)/totalU : null)}</div></div>
      </div>
    </div>` : '';

  document.getElementById('exportDoc').innerHTML = `
    <div class="exp-header">
      <div class="exp-logo">West Brasil</div>
      <div class="exp-header-right">
        <div class="exp-title">Simulação de Margem - Especialidades</div>
        <div class="exp-date">${now}</div>
      </div>
    </div>
    <div class="exp-client">
      <div class="exp-client-nome">${clienteAtual.cod} — ${clienteAtual.nome}</div>
      <div class="exp-client-info">${clienteAtual.ramo} | ${clienteAtual.segmento}</div>
    </div>
    ${produtosHtml}
    ${totaisHtml}
    <div class="exp-footer">West Brasil Lubrificantes • Simulador de Margem - Especialidades</div>`;

  document.getElementById('exportOverlay').classList.add('visible');
  const doc = document.getElementById('exportDoc');
  doc.style.zoom = '1';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const wrap = document.getElementById('exportDocWrap');
    const dispH = wrap.clientHeight - 8;
    const docH  = doc.scrollHeight;
    if (docH > dispH) doc.style.zoom = String((dispH / docH).toFixed(4));
  }));
}

function fecharExport() {
  document.getElementById('exportOverlay').classList.remove('visible');
  document.getElementById('exportDoc').style.zoom = '1';
}
</script>
